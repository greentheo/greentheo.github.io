<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0d0f">
<title>Case study — Theodore Van Rooy</title>
<link rel="stylesheet" href="../css/style.css?v=3">
<link rel="stylesheet" href="css/work.css?v=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%235fd3a6' stroke-width='3'/></svg>">
</head>
<body>
<div class="wrap">
  <header style="padding:54px 0 0">
    <a class="back" href="./">&larr; Selected work</a>
  </header>
  <main class="case" id="case"></main>
  <footer>
    <p><a href="./">All selected work</a> &middot; <a href="../">Side projects</a> &middot;
       <a href="mailto:theodore.vanrooy@gmail.com">theodore.vanrooy@gmail.com</a></p>
  </footer>
</div>

<script type="module">
import { CASES } from './js/cases.js';

const id = new URLSearchParams(location.search).get('id');
const c = CASES.find((x) => x.id === id);
const host = document.getElementById('case');

if (!c) {
  host.innerHTML = `<p class="kicker">Not found</p>
    <h1>No case study by that name</h1>
    <p class="body">Pick one from <a href="./">selected work</a>.</p>`;
} else {
  const i = CASES.indexOf(c);
  const prev = CASES[(i - 1 + CASES.length) % CASES.length];
  const next = CASES[(i + 1) % CASES.length];
  document.title = `${c.client} — Theodore Van Rooy`;
  host.innerHTML = `
    <p class="kicker">${c.client}</p>
    <h1>${c.title}</h1>
    <p class="meta">${c.role} &middot; ${c.period}</p>
    <svg class="hero" viewBox="0 0 160 90" role="img" aria-label="${c.title}">${c.svg}</svg>
    <div class="metrics">${c.metrics.map(([n, l, k]) =>
      `<div class="metric"><b>${n}</b><span>${l}</span>${k ? `<em class="claim ${k}">${k}</em>` : ''}</div>`).join('')}</div>
    ${c.detail.map(([h, p]) => `<section><h2>${h}</h2><p class="body">${p}</p></section>`).join('')}
    <div class="tags" style="padding:6px 0 20px">${c.tags.map((t) =>
      `<span class="tag">${t}</span>`).join('')}</div>
    <div class="nav">
      <a class="mini" href="case.html?id=${prev.id}">&larr; ${prev.client}</a>
      <a class="mini" href="case.html?id=${next.id}">${next.client} &rarr;</a>
    </div>`;
}
</script>
</body>
</html>
